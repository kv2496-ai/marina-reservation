<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHOI Marina Reservations — Reservations</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar no-print">
    <div class="brand">WHOI Marina</div>
    <nav>
        <a href="index.html">Schedule</a>
        <a href="reservations.html" class="active">Reservations</a>
        <a href="vessels.html">Vessels</a>
        <a href="berths.html">Berths</a>
        <a href="resolve.html">Resolve</a>
        <a href="review.html">Review</a>
        <a href="stats.html">Stats</a>
    </nav>
</header>
<main>
    <div class="card no-print">
        <div class="toolbar">
            <div style="flex:2;"><input id="fQuery" placeholder="Search vessel, title, notes…"></div>
            <select id="fBerth"><option value="">All berths</option></select>
            <select id="fKind"><option value="">All kinds</option></select>
            <select id="fStatus"><option value="">All statuses</option></select>
            <input type="date" id="fFrom" title="From">
            <input type="date" id="fTo" title="To">
            <button class="secondary" id="clearBtn">Clear</button>
            <span class="spacer"></span>
            <a class="btn secondary" id="csvLink" href="/api/export/reservations.csv">Export CSV</a>
        </div>
    </div>

    <div class="card">
        <h2 id="resultsHeading">Results</h2>
        <table id="resultsTable" class="responsive-table">
            <thead><tr><th>Start</th><th>End</th><th>Kind</th><th>Vessel / Title</th><th>Berth</th><th>Status</th><th>Rafting</th><th></th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card no-print">
        <h2>Find an available berth</h2>
        <div class="toolbar">
            <input type="date" id="availStart" title="Start date">
            <input type="date" id="availEnd" title="End date">
            <input type="number" id="availLoa" placeholder="LOA (ft, optional)">
            <button id="availBtn">Suggest berths</button>
        </div>
        <table id="availTable" class="responsive-table">
            <thead><tr><th>Berth</th><th>Length</th><th>Fits LOA</th><th>Confirmed conflict</th><th>Note</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</main>

<div id="detailModal"></div>
<script src="js/api.js"></script>
<script src="js/reservation-form.js"></script>
<script src="js/reservations.js"></script>
</body>
</html>
