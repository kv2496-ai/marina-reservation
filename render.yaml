services:
  - type: web
    name: whoi-marina-reservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: MARINA_DATA_DIR
        value: /app/data
    disk:
      name: marina-data
      mountPath: /app/data
      sizeGB: 1
